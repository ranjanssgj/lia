[package]
name = "lia-device-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local-first device agent persistence and signature primitives for LIA"

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = true }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[dev-dependencies]
