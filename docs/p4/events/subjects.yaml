contract_version: "lia.v1"
stream:
  name: LIA_EVENTS_V1
  subjects:
    - "lia.v1.account.*.>"
  storage: file
  retention: limits
  discard_policy: old
  delivery_assumption: at_least_once
  message_id_header: Nats-Msg-Id
  max_age: deployment_value_after_retention_review
  max_bytes: deployment_value_after_capacity_test
  replicas: deployment_profile_value

subject_convention:
  pattern: "lia.v1.account.<account_id>.<aggregate_type>.<event_name>"
  account_id_format: uuid_without_hyphens
  token_case: lowercase
  account_id_is_secret: false
  prohibited_subject_content:
    - usernames
    - email_addresses
    - file_paths
    - secrets
    - message_content
    - provider_payloads

events:
  - subject: "lia.v1.account.*.device.presence.changed"
    owner: device_registry
    producer: device_control_service
    consumer_groups: [workflow_coordinator, device_projection, notification_router]
    ordering_key: [account_id, aggregate_id, aggregate_sequence]
  - subject: "lia.v1.account.*.device.capabilities.changed"
    owner: device_registry
    producer: device_adapter
    consumer_groups: [capability_router, device_projection]
    ordering_key: [account_id, aggregate_id, aggregate_sequence]
  - subject: "lia.v1.account.*.operation.evidence.reported"
    owner: resource_owning_executor
    producer: device_agent_or_connector
    consumer_groups: [workflow_coordinator, operation_audit]
    ordering_key: [account_id, aggregate_id, aggregate_sequence]
  - subject: "lia.v1.account.*.workflow.run.transitioned"
    owner: workflow_authority
    producer: temporal_projection_activity
    consumer_groups: [client_projection, notification_router, analytics_projection]
    ordering_key: [account_id, aggregate_id, aggregate_sequence]
  - subject: "lia.v1.account.*.workflow.step.transitioned"
    owner: workflow_authority
    producer: temporal_projection_activity
    consumer_groups: [client_projection, operation_router, notification_router]
    ordering_key: [account_id, aggregate_id, aggregate_sequence]
  - subject: "lia.v1.account.*.permission.grant.changed"
    owner: permission_authority
    producer: permission_service
    consumer_groups: [workflow_coordinator, device_session_authority, capability_router]
    ordering_key: [account_id, aggregate_id, aggregate_sequence]
  - subject: "lia.v1.account.*.permission.approval.recorded"
    owner: permission_authority
    producer: permission_service
    consumer_groups: [workflow_coordinator, audit_projection]
    ordering_key: [account_id, aggregate_id, aggregate_sequence]
  - subject: "lia.v1.account.*.integration.event.received"
    owner: connector_authority
    producer: authenticated_connector_ingress
    consumer_groups: [workflow_coordinator, integration_projection]
    ordering_key: [account_id, aggregate_id, aggregate_sequence]
  - subject: "lia.v1.account.*.notification.delivery.updated"
    owner: notification_authority
    producer: notification_router
    consumer_groups: [client_projection, notification_audit]
    ordering_key: [account_id, aggregate_id, aggregate_sequence]

consumer_defaults:
  delivery: pull
  acknowledgement: explicit
  ack_after: durable_inbox_and_domain_commit_or_durable_quarantine
  deduplication_key: event_id
  ordering: aggregate_sequence_not_global
  bounded_redelivery: required
  dead_letter_behavior: durable_quarantine_with_redacted_reason
  side_effect_idempotency: application_level_required
  retention: defined_by_data_domain_policy_not_transport_default

notes:
  - "This is a contract inventory, not a deployable NATS server configuration."
  - "Per-account subscriptions and service authorization must be enforced by NATS credentials/permissions and rechecked by each consumer."
  - "No subject or stream configuration grants the consumer permission to execute an operation."
  - "JetStream's at-least-once behavior requires durable application inbox deduplication."
